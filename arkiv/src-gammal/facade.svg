<svg class="facade" viewBox="0 0 640 600" role="img" aria-labelledby="facade-title" xmlns="http://www.w3.org/2000/svg">
  <title id="facade-title">Illustration av Cantinos fasad en kväll: blå skylt med skrivstil, gröna markiser, upplysta fönster, röd matta och lunchtavla på trottoaren.</title>
