    <pattern id="fz-tiles" width="40" height="20" patternUnits="userSpaceOnUse"><rect width="40" height="20" fill="#1B2848"/><path d="M0 .5h40M20 0v20" stroke="#24345A" stroke-width="1"/></pattern>
